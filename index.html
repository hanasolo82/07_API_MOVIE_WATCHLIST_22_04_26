<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/style.css"></link>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Movie Watchlist</title>
  </head>
  <body>
    
    <header>
      <div class="header-container">
        <div class="header-text">
          <h1>Find your film</h1>
          <h3><a href="./src/pages/watchlist.html">My Watchlist</a></h3>
        </div>      
        <img src="https://images.unsplash.com/photo-1628432136678-43ff9be34064?q=80&w=1926&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
      </div>
      <form id="search-form">
        <input
            class="input-search"
            id="input-search"
            placeholder="Seaching Example"
            type="text"
            role="text"
            required
        >
        <button class="input-btn" type="submit">Search</button>
      </form>
    </header>
    <main>
      <div class="container-theme">
      <!--  INITIAL
        <img class="no-data-svg" id="no-data-svg" src="./src/assets/no-data-initial.svg" alt="">
       --> 
        <div class="box-film" id="box-film">
            <img  class="movie-img" id="movie-img" alt="movie list id x">
            <div class="text-container" id="text-container">
              <!--Title-->
              <div class="title-box" id="title-box">
                <div class="title" id="title">
                  <h3>Blade runner</h3>
                </div>
                <div class="title-calification" id="title-calification">
                  <img class="" id="" alt="star">
                  <p class="" id="">8.1</p>
                </div> 
              </div>
              <!--Title-->
              <!--Inline info-->
              <div class="inline-container" id="inline-container">
                <div class="inline-time" id="inline-time">113min</div>
                <div class="inline-list-tipo" id="inline-list-tipo">Action, Drama, Sci-fi</div>
                <div class="add-container" id="add-container">
                  <button type="button" class="add-btn" id="add-btn">+</button>
                  <h4>Watchlist</h4>
                </div>
              </div>
               <!--Inline info-->
               <!--Paragraf info-->
              <div class="paragraf-info-container" id="paragraf-info-container">
                <h3>
                  A blade runner must pursue and terminate four replicants who stole a ship in space, and have returned to Earth to find their creator.
                </h3>
              </div>
               <!--Paragraf info-->
            </div>
        </div>

      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
